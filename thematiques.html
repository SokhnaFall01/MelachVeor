  <link rel="preconnect" href="https://fonts.googleapis.com">

<body data-page="thematiques">
  <a class="lien-evitement" href="#contenu">Aller au contenu</a>
  <header id="entete"></header>

  <main id="contenu">
    <section class="page-entete">
      <div class="conteneur">
        <nav class="fil-ariane" aria-label="Fil d’Ariane"><a href="index.html">Accueil</a> / Thématiques</nav>
        <span class="surtitre">Cinq univers de lecture</span>
        <h1>Thématiques</h1>
        <p>La littérature chrétienne occupe une place importante dans l’identité de MELACH VE’OR, aux côtés d’autres domaines qui éclairent notre manière de comprendre et d’habiter le monde.</p>
      </div>
    </section>

    <section class="section" style="padding-top:2.5rem">
      <div class="conteneur">
        <div class="grille-themes" data-grille-themes data-longue></div>
      </div>
    </section>

    <div id="themes-detail"></div>
  </main>

  <footer id="pied"></footer>

  <script src="js/data.js"></script>
  <script>
    MV.page = function () {
      var el = document.getElementById("themes-detail");
      el.innerHTML = MV.THEMES.map(function (t, i) {
        var livres = MV.LIVRES.filter(function (l) { return l.theme === t.id; }).sort(function (a, b) { return b.appreciation - a.appreciation; }).slice(0, 4);
        return '<section class="section' + (i % 2 === 0 ? ' section-teintee' : '') + '" id="' + t.id + '" style="padding:3.5rem 0">' +
          '<div class="conteneur">' +
            '<div class="section-entete"><div><span class="surtitre">' + MV.echapper(t.court) + '</span>' +
            '<h2 class="titre-section">' + MV.echapper(t.nom) + '</h2><p class="chapo">' + MV.echapper(t.longue) + '</p></div>' +
            '<a class="lien-fleche" href="decouvrir.html?theme=' + t.id + '">Toute la thématique ' + MV.icone("fleche") + '</a></div>' +
            '<div class="grille-livres" data-livres="' + livres.map(function (l) { return l.id; }).join(",") + '"></div>' +
          '</div></section>';
      }).join("");
      el.querySelectorAll("[data-livres]").forEach(function (g) {
        MV.rendreLivres(g, g.getAttribute("data-livres").split(",").map(MV.livre));
        g.removeAttribute("data-livres");
      });
    };
  </script>
  <script src="js/app.js"></script>
</body>
</html>
